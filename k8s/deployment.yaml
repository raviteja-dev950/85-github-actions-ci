apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-deploy
  template:
    metadata:
      labels:
        app: k8s-deploy
    spec:
      containers:
      - name: k8s-deploy
        image: 84-k8s-deploy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9494